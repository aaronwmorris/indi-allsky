name: Build & Package Debian Release (.deb)

on:
  push:
    tags:
      - 'indi_v*'
  schedule:
    # Nightly build every night at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      indi_core_tag:
        description: 'Pinned INDI Core Git Tag'
        required: false
        default: 'v2.2.4.2'
      indi_3rdparty_tag:
        description: 'Pinned INDI 3rd-Party Git Tag'
        required: false
        default: 'v2.2.4.1'

env:
  INDI_CORE_TAG: 'v2.2.4.2'
  INDI_3RDPARTY_TAG: 'v2.2.4.1'

jobs:
  build-deb:
    name: Build .deb (${{ matrix.distro }} / ${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [bookworm, noble, trixie]
        arch: [amd64, arm64]
        include:
          - distro: bookworm
            image: debian:bookworm
          - distro: noble
            image: ubuntu:noble
          - distro: trixie
            image: debian:trixie

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up QEMU for Multi-Arch Builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve Version & Distribution Suite (Stable vs Nightly)
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]] || [[ "${{ github.ref }}" == refs/tags/indi_v* ]]; then
            # Tagged Release -> Stable
            RAW_TAG="${GITHUB_REF_NAME}"
            VERSION="${RAW_TAG#indi_v}"
            VERSION="${VERSION#v}"
            SUITE="stable"
            IS_RELEASE="true"
          else
            # Nightly / Dev Build -> Nightly
            DATE_STAMP=$(date +'%Y%m%d.%H%M')
            BASE_VER=$(python3 misc/bump_version.py --show | awk '{print $NF}')
            VERSION="${BASE_VER}~nightly.${DATE_STAMP}"
            SUITE="nightly"
            IS_RELEASE="false"
          fi

          # Use pinned stable INDI releases (with workflow_dispatch input fallback)
          INDI_CORE_TAG="${{ inputs.indi_core_tag || env.INDI_CORE_TAG }}"
          INDI_3RDPARTY_TAG="${{ inputs.indi_3rdparty_tag || env.INDI_3RDPARTY_TAG }}"
          INDI_3RDPARTY_VER="${INDI_3RDPARTY_TAG#v}"

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "SUITE=$SUITE" >> $GITHUB_ENV
          echo "IS_RELEASE=$IS_RELEASE" >> $GITHUB_ENV
          echo "INDI_CORE_TAG=$INDI_CORE_TAG" >> $GITHUB_ENV
          echo "INDI_3RDPARTY_TAG=$INDI_3RDPARTY_TAG" >> $GITHUB_ENV
          echo "INDI_3RDPARTY_VER=$INDI_3RDPARTY_VER" >> $GITHUB_ENV
          echo "Building Version: $VERSION | Suite: $SUITE | Pinned INDI Core: $INDI_CORE_TAG | Pinned INDI 3rdParty: $INDI_3RDPARTY_TAG"

      - name: Generate Dynamic Version & debian/changelog
        run: |
          python3 misc/bump_version.py "${{ env.VERSION }}" "${{ env.SUITE }}"

      - name: Generate Release Notes Summary & Git Changelog
        run: |
          {
            echo "### Bundled INDI & Driver Versions"
            echo "* **INDI Core / Server**: \`${{ env.INDI_CORE_TAG }}\`"
            echo "* **INDI 3rd-Party Drivers**: \`${{ env.INDI_3RDPARTY_TAG }}\` (ZWO ASI, QHY, Player One, ToupTek, SVBONY, Starlight Xpress, etc.)"
            echo "* **Supported Architectures**: \`arm64\` (Raspberry Pi 4/5, aarch64), \`amd64\` (x86_64)"
            echo "* **Distributions**: Debian 12 (Bookworm), Debian 13 (Trixie), Ubuntu 24.04 (Noble)"
            echo ""
            echo "### What's Changed"
            # Ensure all git tags are fetched locally
            git fetch --tags --force 2>/dev/null || true
            PREV_TAG=$(git describe --tags --abbrev=0 --match "indi_v*" --match "v*" HEAD^ 2>/dev/null || git tag -l "indi_v*" "v*" --sort=-creatordate | head -n 1)
            if [ -n "$PREV_TAG" ]; then
              echo "Commits since **${PREV_TAG}**:"
              echo ""
              git log --no-merges "${PREV_TAG}..HEAD" --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H)) - %an"
            else
              echo "Recent commits:"
              echo ""
              git log --no-merges -n 20 --pretty=format:"* %s ([%h](https://github.com/${{ github.repository }}/commit/%H)) - %an"
            fi
            echo ""
            echo "---"
          } > release_notes.md

      - name: Build Debian Package (.deb) in Native Multi-Arch Container
        run: |
          docker run --rm --platform linux/${{ matrix.arch }} \
            -v "$PWD:/work:z" \
            -w /work \
            -e DEBIAN_FRONTEND=noninteractive \
            -e VERSION="${{ env.VERSION }}" \
            -e SUITE="${{ env.SUITE }}" \
            -e INDI_CORE_TAG="${{ env.INDI_CORE_TAG }}" \
            -e INDI_3RDPARTY_TAG="${{ env.INDI_3RDPARTY_TAG }}" \
            -e INDI_3RDPARTY_VER="${{ env.INDI_3RDPARTY_VER }}" \
            ${{ matrix.image }} bash -c '
              set -e
              chmod -R a+rX /work 2>/dev/null || true
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential \
                dpkg-dev \
                debhelper \
                dh-python \
                python3-all \
                python3-setuptools \
                python3-venv \
                python3-dev \
                python3-pip \
                python3-wheel \
                cmake \
                pkgconf \
                libimath-dev \
                libopenexr-dev \
                libcfitsio-dev \
                libnova-dev \
                libopencv-dev \
                libopenblas-dev \
                libraw-dev \
                libtiff-dev \
                libpng-dev \
                zlib1g-dev \
                libcurl4-gnutls-dev \
                libssl-dev \
                libusb-1.0-0-dev \
                libgphoto2-dev \
                libgps-dev \
                libjpeg-dev \
                libftdi1-dev \
                libgsl-dev \
                libboost-dev \
                libboost-regex-dev \
                libboost-program-options-dev \
                libzmq3-dev \
                liblimesuite-dev \
                libdc1394-dev \
                libnutclient-dev \
                libavcodec-dev \
                libavformat-dev \
                libavutil-dev \
                libswscale-dev \
                cdbs \
                liberfa-dev \
                libtheora-dev \
                libogg-dev \
                libfftw3-dev \
                libev-dev \
                librtlsdr-dev \
                libudev-dev \
                libavdevice-dev \
                libdbus-1-dev \
                libglib2.0-dev \
                libsystemd-dev \
                fxload \
                swig \
                git \
                curl \
                jq \
                ca-certificates

              # Set Debian build options to disable automatic debug symbol packages
              export DEB_BUILD_OPTIONS="noautodbgsym noddebs"

              # 1. Build INDI Core (indilib/indi)
              echo "=== Building INDI Core (${INDI_CORE_TAG}) ==="
              git clone --depth 1 --branch "${INDI_CORE_TAG}" https://github.com/indilib/indi.git /tmp/indi-core
              cd /tmp/indi-core
              dpkg-buildpackage -b -us -uc -d
              
              # Install all freshly built INDI core deb packages and resolve dependencies
              echo "=== Installing freshly built INDI Core packages ==="
              cd /tmp
              dpkg -i *.deb || apt-get install -f -y
              ldconfig

              # 2. Build INDI 3rd-party camera drivers (Consolidated single deb)
              echo "=== Building Consolidated INDI 3rd-Party Drivers (${INDI_3RDPARTY_TAG}) ==="
              git clone --depth 1 --branch "${INDI_3RDPARTY_TAG}" https://github.com/indilib/indi-3rdparty.git /tmp/indi-3rdparty
              
              INDI_LIBS="libasi libplayerone libsvbony libqhy libtoupcam libaltaircam libbressercam libmallincam libmeadecam libnncam libogmacam libomegonprocam libstarshootg libtscam libsvbonycam"
              INDI_DRIVERS="indi-asi indi-playerone indi-svbony indi-qhy indi-sx indi-dsi indi-toupbase indi-gphoto indi-webcam indi-gpsd indi-gpsnmea"

              # Pass 1: Build vendor SDK shared libraries
              for lib in $INDI_LIBS; do
                if [ -d "/tmp/indi-3rdparty/$lib" ]; then
                  echo "=== Building library: $lib ==="
                  mkdir -p "/tmp/indi-3rdparty/build-$lib"
                  cd "/tmp/indi-3rdparty/build-$lib"
                  if cmake -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release "/tmp/indi-3rdparty/$lib"; then
                    make -j$(nproc) || true
                    make install || true
                    DESTDIR=/tmp/pkg-3rdparty make install || true
                  fi
                fi
              done
              ldconfig

              # Pass 2: Build camera driver binaries
              for drv in $INDI_DRIVERS; do
                if [ -d "/tmp/indi-3rdparty/$drv" ]; then
                  echo "=== Building driver: $drv ==="
                  mkdir -p "/tmp/indi-3rdparty/build-$drv"
                  cd "/tmp/indi-3rdparty/build-$drv"
                  if cmake -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_BUILD_TYPE=Release "/tmp/indi-3rdparty/$drv"; then
                    make -j$(nproc) || true
                    DESTDIR=/tmp/pkg-3rdparty make install || true
                  fi
                fi
              done

              # Construct single consolidated debian package for 3rdparty drivers
              mkdir -p /tmp/pkg-3rdparty/DEBIAN
              ARCH=$(dpkg --print-architecture)
              {
                echo "Package: indi-3rdparty"
                echo "Version: ${INDI_3RDPARTY_VER}"
                echo "Architecture: ${ARCH}"
                echo "Maintainer: INDI Allsky Maintainers <support@indi-allsky.org>"
                echo "Depends: libusb-1.0-0, libcfitsio10 | libcfitsio9 | libcfitsio-dev, libnova-0.16-0 | libnova-dev"
                echo "Description: Consolidated 3rd-party INDI camera drivers (ZWO ASI, QHY, PlayerOne, ToupTek, SVBony, SX, etc.)"
              } > /tmp/pkg-3rdparty/DEBIAN/control
              dpkg-deb --build /tmp/pkg-3rdparty /indi-3rdparty_${INDI_3RDPARTY_VER}_${ARCH}.deb

              # 3. Build indi-allsky
              echo "=== Generating on-the-fly debian/changelog ==="
              cd /work
              python3 misc/bump_version.py "${VERSION}" "${SUITE}"

              echo "=== Building indi-allsky ==="
              dpkg-buildpackage -b -us -uc

              # Clean up any debug symbol packages before packaging
              rm -f /*-dbgsym*.deb /tmp/*-dbgsym*.deb /*-dbg*.deb /tmp/*-dbg*.deb /work/*-dbgsym*.deb /work/*-dbg*.deb 2>/dev/null || true

              # Collect and tag all built .deb packages with distribution suite suffix
              for f in /*.deb /tmp/*.deb; do
                if [ -f "$f" ]; then
                  fname=$(basename "$f")
                  pkg=$(echo "$fname" | cut -d_ -f1)
                  ver=$(echo "$fname" | cut -d_ -f2)
                  arch_deb=$(echo "$fname" | cut -d_ -f3)
                  if [ -n "$pkg" ] && [ -n "$ver" ] && [ -n "$arch_deb" ]; then
                    mv "$f" "/work/${pkg}_${ver}+${{ matrix.distro }}_${arch_deb}" 2>/dev/null || true
                  fi
                fi
              done

              chown -R '$(id -u):$(id -g)' /work || true
            '

      - name: Run Automated QA on Generated .deb
        run: |
          docker run --rm --platform linux/${{ matrix.arch }} \
            -v "$PWD:/work:z" \
            -w /work \
            -e DEBIAN_FRONTEND=noninteractive \
            ${{ matrix.image }} bash /work/debian/tests/qa_test.sh

      - name: Upload .deb Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.distro }}-${{ matrix.arch }}
          path: "*.deb"

      - name: Upload Release Notes
        if: matrix.distro == 'bookworm' && matrix.arch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md

  publish:
    name: Publish Releases
    needs: [build-deb]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/indi_v') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download all built .deb artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-debs
          merge-multiple: true

      - name: Attach .deb to Stable GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/indi_v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: downloaded-debs/release_notes.md
          generate_release_notes: true
          files: downloaded-debs/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach .deb to Nightly Pre-Release
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/indi_v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "nightly"
          prerelease: true
          body_path: downloaded-debs/release_notes.md
          generate_release_notes: true
          files: downloaded-debs/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


