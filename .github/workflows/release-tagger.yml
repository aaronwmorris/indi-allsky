name: Monthly Release Bump

on:
  schedule:
    - cron: '20 4 1 * *'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Custom release tag (e.g. indi_v2026.10.01). Leave blank to auto-generate based on current UTC date.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Git identity
        run: |
          git config user.name "indi-release-bot[bot]"
          git config user.email "indi-release-bot[bot]@users.noreply.github.com"

      - name: Bump version, tag, and push
        run: |
          # Generate version string based on current UTC date: indi_vYYYY.MM.01 (or use manual input if provided)
          if [ -n "${{ inputs.release_tag }}" ]; then
            RELEASE_TAG="${{ inputs.release_tag }}"
          else
            RELEASE_TAG="indi_v$(date -u +'%Y.%m.01')"
          fi
          echo "Bumping to version: ${RELEASE_TAG}"

          # 1. Run version bump script
          npm run version:bump -- "${RELEASE_TAG}"

          # 2. Stage tracked modified files and commit
          git add -u
          git commit -m "Release ${RELEASE_TAG}"

          # 3. Create annotated tag
          git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}"

          # 4. Push commit and tags to main (will trigger the deb workflow)
          git push origin main
          git push origin "${RELEASE_TAG}"
