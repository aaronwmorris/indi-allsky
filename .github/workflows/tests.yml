name: Unit & Integration Tests

on:
  pull_request:
    branches:
      - main

jobs:
  pytest:
    name: Pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libindi-dev \
            swig \
            libnova-dev \
            libcfitsio-dev \
            libcurl4-openssl-dev \
            libdbus-1-dev \
            libglib2.0-dev \
            libsystemd-dev \
            pkg-config \
            ffmpeg \
            gifsicle

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'requirements/requirements_latest.txt'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Environment & Dependencies (Frontend + Python .venv)
        run: |
          npm install

      - name: Verify CSS Build
        run: |
          npm run build

      - name: Run Test Suite
        run: |
          npm test
