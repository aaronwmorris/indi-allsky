name: Build and Publish Docker Images

on:
  workflow_call:
    inputs:
      apt_channel:
        description: 'APT repository channel (stable, nightly, or auto)'
        required: false
        default: 'auto'
        type: string

jobs:
  build-and-push:
    name: Build & Push Multi-Arch Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Docker Image Tags and Channel
        id: docker_meta
        run: |
          INPUT_CHANNEL="${{ inputs.apt_channel }}"
          if [ -n "$INPUT_CHANNEL" ] && [ "$INPUT_CHANNEL" != "auto" ]; then
            APT_CHANNEL="$INPUT_CHANNEL"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]] || [[ "${{ github.ref }}" == refs/tags/indi_v* ]]; then
            APT_CHANNEL="stable"
          else
            APT_CHANNEL="nightly"
          fi

          IMAGE_NAME="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          DATE_STAMP=$(date +'%Y%m%d')

          TAGS=""
          if [ "$APT_CHANNEL" = "stable" ]; then
            TAGS="${IMAGE_NAME}:stable,${IMAGE_NAME}:latest"
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              RAW_TAG="${GITHUB_REF_NAME}"
              VERSION="${RAW_TAG#indi_v}"
              VERSION="${VERSION#v}"
              TAGS="${TAGS},${IMAGE_NAME}:v${VERSION},${IMAGE_NAME}:${VERSION}"
              echo "Building STABLE Docker image for release ${VERSION}..."
            else
              echo "Building STABLE Docker image..."
            fi
          else
            TAGS="${IMAGE_NAME}:nightly,${IMAGE_NAME}:nightly-${DATE_STAMP}"
            echo "Building NIGHTLY Docker image (${DATE_STAMP})..."
          fi

          echo "apt_channel=${APT_CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Multi-Arch Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          build-args: |
            APT_CHANNEL=${{ steps.docker_meta.outputs.apt_channel }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
