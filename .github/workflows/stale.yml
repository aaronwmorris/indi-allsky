name: Close Stale Issues and Pull Requests

on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Mark and close stale issues and PRs
        uses: actions/stale@v9
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 90
          days-before-pr-close: 14
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          exempt-issue-labels: 'pinned,security'
          exempt-pr-labels: 'edge,pinned,security'
          remove-stale-when-updated: true
          operations-per-run: 50
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not
            had recent activity for 60 days. It will be closed in 14 days if no
            further activity occurs. Please comment if this is still relevant.
          close-issue-message: >
            This issue was closed due to inactivity. Feel free to reopen it or
            open a new issue with updated details if the problem persists.
          stale-pr-message: >
            This pull request has been automatically marked as stale because it
            has not had recent activity for 90 days. It will be closed in 14 days
            if no further activity occurs.
          close-pr-message: >
            This pull request was closed due to inactivity. Feel free to reopen
            it when ready to continue.
