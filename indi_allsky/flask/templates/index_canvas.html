{% extends 'base.html' %}

{% block title %}{{ website_title }}: {{ page_title }}{% endblock %}

{% block header_title %}Latest Capture (Canvas){% endblock %}

{% block head %}
<meta charset="UTF-8">
<style>
canvas {
    width: 100%;
    height: auto;
}
</style>
<script defer src="{{ url_for('indi_allsky.static', filename='js/live_frames.js') }}?v=1"></script>
<script defer src="{{ url_for('indi_allsky.static', filename='js/latest_view.js') }}?v=1"></script>
{% endblock %}

{% block content %}
<div id="live-view" class="tw:flex tw:flex-col tw:h-full tw:gap-4" data-interval="{{ refreshInterval | int }}"
     data-endpoint="{{ url_for(latest_image_view, camera_id=camera_id, limit_s=900, night='auto') }}">
    <div data-live-screen class="tw:flex-1 tw:bg-base-300 tw:rounded-[var(--radius-box)] tw:border tw:border-base-300 tw:shadow-inner tw:flex tw:items-center tw:justify-center tw:overflow-hidden tw:min-h-[50vh] tw:relative">
        <div class="tw:absolute tw:inset-0 tw:bg-base-content/2 tw:pointer-events-none"></div>
        
        <!-- Status Overlay -->
        <div id="status-overlay" role="status" class="tw:absolute tw:top-4 tw:left-4 tw:z-20 tw:hidden">
            <div class="tw:badge tw:badge-soft tw:badge-info tw:gap-2 tw:py-3.5 tw:px-4 tw:rounded-[var(--radius-box)] tw:border tw:border-base-300 tw:shadow-sm tw:backdrop-blur-md">
                <i class="tw:icon-[lucide--info] tw:w-3.5 tw:h-3.5"></i>
                <span id="message" class="tw:font-bold tw:text-[0.625rem] tw:uppercase tw:tracking-wider">Syncing Data...</span>
            </div>
        </div>

        <!-- Control Overlay -->
        <div class="tw:absolute tw:top-4 tw:right-4 tw:z-20">
            <button data-live-fullscreen type="button"
                    title="Toggle Fullscreen"
                    class="tw:btn tw:btn-square tw:btn-sm tw:bg-base-100/50 tw:backdrop-blur-md tw:border-base-300 hover:tw:bg-base-100 tw:rounded-[var(--radius-box)] tw:cursor-pointer tw:transition-all shadow-sm">
                <i class="tw:icon-[lucide--maximize] tw:w-4 tw:h-4 tw:opacity-70"></i>
            </button>
        </div>

        <canvas id="canvas" class="tw:mx-auto tw:max-h-full tw:max-w-full tw:object-contain tw:rounded-[var(--radius-box)] tw:shadow-2xl tw:cursor-zoom-in"></canvas>
    </div>
</div>
{% endblock %}
