{% extends 'base.html' %}

{% block title %}{{ website_title }}: {{ page_title }}{% endblock %}

{% block head %}
<meta charset="UTF-8">
<script type="text/javascript">
var img;
var camera_id = {{ camera_id }};
var url = '{{ keogram_uri }}';
var refreshInterval = {{ refreshInterval | int }};
var img;
var fullscreen = false;  //initial state

function init() {
    loop();
}

function loop() {
    img = new Image();
    img.onload = function() {
        $('#message').empty();
        $('#message').addClass('tw:hidden');

        $('#keogram-image').attr({
            'src': this.src,
        });
    };


    showImage(url);


    $('#download').html(
        $('<a />', {
            'href'     : "{{ keogram_uri }}",
            'rel'      : 'noopener noreferrer',
            'download' : '',
            'class'    : 'tw:btn tw:btn-sm tw:btn-neutral tw:gap-2 tw:no-underline',
        }).html('<i class="tw:icon-[lucide--download] tw:w-4 tw:h-4"></i> Download')
    );


    setTimeout(loop, refreshInterval);
}


function showImage(url) {
    console.log('Showing image ' + url);
    img.src = url + "?t=" + new Date().getTime();
}


function setResizeHandler(callback, timeout) {
    var timer_id = undefined;
    $(window).on("resize", function() {
        if(timer_id != undefined) {
            clearTimeout(timer_id);
            timer_id = undefined;
        }
        timer_id = setTimeout(function() {
            timer_id = undefined;
            callback();
        }, timeout);
    });
}

function resize_callback() {
    showImage(url);
}
setResizeHandler(resize_callback, 200);


function goFullscreen(elem) {
    if(fullscreen) {
        closeFullscreen();
    } else {
        openFullscreen(elem);
    }
}

function openFullscreen(elem) {
    if (elem.requestFullscreen) {
        elem.requestFullscreen();
    } else if (elem.webkitRequestFullscreen) { /* Safari */
        elem.webkitRequestFullscreen();
    } else if (elem.msRequestFullscreen) { /* IE11 */
        elem.msRequestFullscreen();
    }

    fullscreen = true;
}

function closeFullscreen() {
    if (document.exitFullscreen) {
        document.exitFullscreen();
    } else if (document.webkitExitFullscreen) { /* Safari */
        document.webkitExitFullscreen();
    } else if (document.msExitFullscreen) { /* IE11 */
        document.msExitFullscreen();
    }

    fullscreen = false;
}



$( document ).ready(function() {
    $('#keogram-image').on("click", function() {
        window.open(url, '_blank');
    });

    init();
});

</script>
{% endblock %}

{% block content %}
<div class="tw:p-4 tw:flex tw:flex-col tw:gap-4 tw:w-full">

    <!-- Loading Spinner -->
    <div class="tw:flex tw:justify-center tw:py-4">
        <span id="message" class="tw:loading tw:loading-spinner tw:loading-md tw:text-primary/60"></span>
    </div>

    <!-- Image — constrained to viewport height, click opens full in new tab -->
    <div class="tw:flex tw:items-center tw:justify-center tw:w-full">
        <img id="keogram-image"
             class="tw:w-full tw:object-contain tw:rounded-[var(--radius-box)] tw:cursor-pointer tw:shadow-md"
             style="display: none; max-height: calc(100vh - 220px);"
             title="Click to open full size in new tab"
             onerror="this.style.display='none';"
             onload="this.style.display='block';">
    </div>

    <!-- Download button — below image -->
    <div class="tw:flex tw:justify-center tw:pt-2">
        <div id="download" class="tw:flex tw:gap-2"></div>
    </div>

</div>
{% endblock %}
