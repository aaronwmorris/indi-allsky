{% extends 'base.html' %}

{% block title %}{{ website_title }}: {{ page_title }}{% endblock %}

{% block header_title %}Latest Capture{% endblock %}

{% block head %}
<meta charset="UTF-8">
<script type="text/javascript">
var img;
var json_data = {
    'latest_image' : {
        'url' : null,
        'width': 0,
        'height': 0,
        'message' : ''
    }
};
var max_age = 900;
var camera_id = {{ camera_id }};
var refreshInterval = {{ refreshInterval | int }};
var night = {{ night }};
var fullscreen = false;  //initial state

function init() {
    loadNextImage();
    loop();
}

async function loop() {
    while(json_data['latest_image']['url'] == null) {
        await sleep(100);
    }

    img = new Image();
    img.onload = function() {
        $('#latest-image').attr({
            'src': this.src,
        });
    };

    showImage(json_data['latest_image']);
    setTimeout(loop, refreshInterval);
}

function showImage(entry) {
    img.src = entry["url"];
}

function loadNextImage() {
    loadJS("{{ url_for(latest_image_view) }}", {'camera_id' : camera_id, 'limit_s' : max_age, 'night' : night}, function() {});
    setTimeout(loadNextImage, refreshInterval);
}

function sleep(time) {
    return new Promise(resolve => setTimeout(resolve, time));
}

function loadJS(url, data, onDone, onError) {
    if(!onDone)onDone=function(){};
    if(!onError)onError=function(){};

    $.ajax({
        type: "GET",
        url: url,
        contentType: "application/json",
        data: data,
        success: function(rdata){
            json_data = rdata
            const msg = json_data['latest_image']['message'];
            const overlay = $('#status-overlay');
            if (msg && msg.trim() !== '') {
                $('#message').html(msg);
                overlay.removeClass('tw:hidden');
            } else {
                overlay.addClass('tw:hidden');
            }
        },
        error: function(rdata){
            onError(rdata.status);
            $('#message').html('Error loading data.');
            $('#status-overlay').removeClass('tw:hidden');
        },
    });
}

function setResizeHandler(callback, timeout) {
    var timer_id = undefined;
    $(window).on("resize", function() {
        if(timer_id != undefined) {
            clearTimeout(timer_id);
            timer_id = undefined;
        }
        timer_id = setTimeout(function() {
            timer_id = undefined;
            callback();
        }, timeout);
    });
}

function resize_callback() {
    if (json_data['latest_image']) {
        showImage(json_data['latest_image']);
    };
}
setResizeHandler(resize_callback, 200);

function goFullscreen(elem) {
    if(fullscreen) {
        closeFullscreen();
    } else {
        openFullscreen(elem);
    }
}

function openFullscreen(elem) {
    if (elem.requestFullscreen) {
        elem.requestFullscreen();
    } else if (elem.webkitRequestFullscreen) { /* Safari */
        elem.webkitRequestFullscreen();
    } else if (elem.msRequestFullscreen) { /* IE11 */
        elem.msRequestFullscreen();
    }
    fullscreen = true;
}

function closeFullscreen() {
    if (document.exitFullscreen) {
        document.exitFullscreen();
    } else if (document.webkitExitFullscreen) { /* Safari */
        document.webkitExitFullscreen();
    } else if (document.msExitFullscreen) { /* IE11 */
        document.msExitFullscreen();
    }
    fullscreen = false;
}

$( document ).ready(function() {
    $('#latest-image').on("click", function() {
        goFullscreen(this);
    });
    init();
});
</script>
{% endblock %}

{% block content %}
<div class="tw:flex tw:flex-col tw:h-full tw:gap-4">
    <!-- Image Container Node -->
    <div class="tw:flex-1 tw:bg-base-300 tw:rounded-[var(--radius-box)] tw:border tw:border-base-300 tw:shadow-inner tw:flex tw:items-center tw:justify-center tw:overflow-hidden tw:min-h-[50vh] tw:relative">
        <div class="tw:absolute tw:inset-0 tw:bg-base-content/2 tw:pointer-events-none"></div>
        
        <!-- Status Overlay -->
        <div id="status-overlay" class="tw:absolute tw:top-4 tw:left-4 tw:z-20 tw:hidden">
            <div class="tw:badge tw:badge-soft tw:badge-info tw:gap-2 tw:py-3.5 tw:px-4 tw:rounded-[var(--radius-box)] tw:border tw:border-base-300 tw:shadow-sm tw:backdrop-blur-md">
                <i class="tw:icon-[lucide--info] tw:w-3.5 tw:h-3.5"></i>
                <span id="message" class="tw:font-bold tw:text-[0.625rem] tw:uppercase tw:tracking-wider">Syncing Data...</span>
            </div>
        </div>

        <!-- Control Overlay -->
        <div class="tw:absolute tw:top-4 tw:right-4 tw:z-20">
            <button onclick="goFullscreen(document.getElementById('latest-image'))" 
                    title="Toggle Fullscreen"
                    class="tw:btn tw:btn-square tw:btn-sm tw:bg-base-100/50 tw:backdrop-blur-md tw:border-base-300 hover:tw:bg-base-100 tw:rounded-[var(--radius-box)] tw:cursor-pointer tw:transition-all shadow-sm">
                <i class="tw:icon-[lucide--maximize] tw:w-4 tw:h-4 tw:opacity-70"></i>
            </button>
        </div>

        <img id="latest-image" 
            class="tw:mx-auto tw:max-h-full tw:max-w-full tw:object-contain tw:rounded-[var(--radius-box)] tw:shadow-2xl tw:cursor-zoom-in tw:transition-opacity tw:duration-700 tw:relative tw:z-10" 
            alt="Latest Allsky Capture"
            style="opacity: 0;"
            onerror="this.style.opacity='0';"
            onload="this.style.opacity='1';">
    </div>
</div>
{% endblock %}
