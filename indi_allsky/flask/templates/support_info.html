{% extends 'base.html' %}

{% block title %}{{ website_title }}: {{ page_title }}{% endblock %}

{% block head %}
<meta charset="UTF-8">
<script type="text/javascript" src="{{ url_for('indi_allsky.static', filename='js/clipboard.min.js') }}"></script>
<script type="text/javascript">
var camera_id = {{ camera_id }};
</script>
{% endblock %}

{% block content %}
<div class="tw:w-full tw:space-y-6 tw:p-2">

    <div class="tw:flex tw:flex-wrap tw:items-center tw:gap-3 tw:pb-2">
        
        <button type="button" 
                class="tw:btn tw:btn-primary tw:btn-sm  tw:h-12 tw:text-[10px] tw:font-bold tw:uppercase tw:tracking-wider copy-clipboard" 
                data-clipboard-target="#support_info">
            Copy Support Info<br>to Clipboard
        </button>

        <button type="button" id="dl_support" 
                class="tw:btn tw:btn-info tw:btn-sm  tw:h-12 tw:text-[10px] tw:font-bold tw:uppercase tw:tracking-wider tw:text-info-content">
            Support Info<br>Download
        </button>

        <a href="https://github.com/aaronwmorris/indi-allsky/issues" target="_blank"
           class="tw:btn tw:btn-error tw:btn-sm  tw:h-12 tw:text-[10px] tw:font-bold tw:uppercase tw:tracking-wider">
            indi-allsky<br>GitHub Issues
        </a>

        <div id="loader_support" class="tw:hidden tw:ml-4">
            <span class="tw:loading tw:loading-spinner tw:loading-md tw:text-info"></span>
        </div>
    </div>

    <div class="tw:grid tw:grid-cols-2 md:tw:grid-cols-4 tw:gap-3">
        <a href="{{ url_for('indi_allsky.log_download_view') }}" class="tw:btn tw:btn-sm tw:btn-success tw:btn-outline  tw:h-12 tw:text-[10px] tw:font-bold tw:uppercase tw:tracking-wider">Capture Log</a>
        <a href="{{ url_for('indi_allsky.log_webapp_download_view') }}" class="tw:btn tw:btn-sm tw:btn-neutral tw:btn-outline  tw:h-12 tw:text-[10px] tw:font-bold tw:uppercase tw:tracking-wider">Webapp Log</a>
        <a href="{{ url_for('indi_allsky.log_syslog_download_view') }}" class="tw:btn tw:btn-sm tw:btn-primary tw:btn-outline  tw:h-12 tw:text-[10px] tw:font-bold tw:uppercase tw:tracking-wider">OS System Log</a>
        <a href="{{ url_for('indi_allsky.log_kern_download_view') }}" class="tw:btn tw:btn-sm tw:btn-warning tw:btn-outline  tw:h-12 tw:text-[10px] tw:font-bold tw:uppercase tw:tracking-wider">Kernel Log</a>
    </div>

    <div class="tw:text-[11px] tw:font-medium tw:text-base-content/50 tw:px-1">
        Support info can be pasted directly into an issue.
    </div>

    <div class="tw:card tw:bg-base-300 tw:border tw:border-base-300 tw:shadow-inner tw:rounded-[var(--radius-box)] tw:overflow-hidden">
        <div class="tw:card-body tw:p-0">
            <textarea id="support_info" 
                      class="tw:w-full tw:h-[600px] tw:bg-neutral-800 tw:text-neutral-200 tw:font-mono tw:text-[11px] tw:p-4 tw:resize-none tw:border-none tw:focus:outline-none" 
                      readonly>Loading...</textarea>
        </div>
    </div>

</div>

<script>

function loadSupportInfo() {
    console.log('Loading support info');
    loadJS("{{ url_for('indi_allsky.js_support_info_view') }}");
}


function loadJS(url, onDone, onError) {
    if(!onDone)onDone=function(){};
    if(!onError)onError=function(){};

    $.ajax({
        type: "GET",
        url: url,
        contentType: "application/json",
        data: {},
        success: function(json_data){
            $("#support_info").text(json_data['support_info']);
            $("#loader_support").css({'display' : 'none'});

            // add download action
            $('#dl_support').on('click', saveTextAsFile);
        },
        error: function(data){
            onError(data.status);
        },
    });
}


async function createGzipFile(dataString, filename) {
  // Convert the string to a Uint8Array
  const textEncoder = new TextEncoder();
  const dataBytes = textEncoder.encode(dataString);

  // Create a ReadableStream from the data
  const readableStream = new ReadableStream({
    start(controller) {
      controller.enqueue(dataBytes);
      controller.close();
    }
  });

  // Create a CompressionStream for gzip
  const compressionStream = new CompressionStream('gzip');

  // Pipe the data through the compression stream
  const compressedStream = readableStream.pipeThrough(compressionStream);

  // Convert the compressed stream to a Blob
  const compressedBlob = await new Response(compressedStream).blob();

  // Create a download link for the Blob
  const url = URL.createObjectURL(compressedBlob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url); // Clean up the object URL
}


function saveTextAsFile() {
    var textToWrite = $('#support_info').val();

    var d = new Date(Date.now());
    var year = d.getFullYear();
    var month = '' + (d.getMonth() + 1);
    var day = '' + d.getDate();
    var hour = '' + d.getHours();
    var minute = '' + d.getMinutes();
    var second = '' + d.getSeconds();

    var fileNameToSaveAs = "indi-allsky_support_info_" + year + month + day + "_" + hour + minute + second + ".txt.gz";

    createGzipFile(textToWrite, fileNameToSaveAs);
}


function init() {
    new ClipboardJS('.copy-clipboard');

    loadSupportInfo();
}


$( document ).ready(function() {
    init();
});

</script>
{% endblock %}
