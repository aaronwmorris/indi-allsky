allow_anonymous false
password_file /etc/mosquitto/passwd


# MQTT (plaintext bound to loopback only; use 8883 for network access)
listener 1883 127.0.0.1
protocol mqtt

listener 8883
protocol mqtt

cafile /etc/ssl/certs/ca-certificates.crt
certfile /etc/mosquitto/certs/indi-allsky_mosquitto.crt
keyfile /etc/mosquitto/certs/indi-allsky_mosquitto.key
tls_version tlsv1.2

require_certificate false


# Websockets (plaintext bound to loopback only; use 8081 for network access)
listener 8083 127.0.0.1
protocol websockets

listener 8081
protocol websockets

cafile /etc/ssl/certs/ca-certificates.crt
certfile /etc/mosquitto/certs/indi-allsky_mosquitto.crt
keyfile /etc/mosquitto/certs/indi-allsky_mosquitto.key
tls_version tlsv1.2

require_certificate false
