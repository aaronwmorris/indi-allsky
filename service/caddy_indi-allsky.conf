### indi-allsky caddy config
###
### Import config via the caddy API (the generated warning may be ignored)
# curl "http://localhost:2019/load" -H "Content-Type: text/caddyfile" -d @/etc/caddy/indi-allsky.caddy

{
    http_port %HTTP_PORT%
    https_port %HTTPS_PORT%
}

http://, https:// {
    tls internal
    tls {
        on_demand
    }

    redir / /indi-allsky/

    ### indi-allsky config
    handle /indi-allsky* {
        handle /images/* {
            root * %IMAGE_FOLDER%
            file_server
        }

        handle /static/* {
            root * %ALLSKY_DIRECTORY%/indi_allsky/flask/static
            file_server
        }

        handle {
            reverse_proxy %UPSTREAM_SERVER%
        }
    }

    ### ADSB Aircraft tracking
    handle /skyaware* {
        handle /data/* {
            root * /run/dump1090-fa
            file_server
        }

        handle /data-978/* {
            root * /run/skyaware978
            file_server
        }

        handle {
            root * /usr/share/skyaware/html
            file_server
        }
    }
}
