{
    http_port %HTTP_PORT%
    https_port %HTTPS_PORT%
}

http://, https:// {
    tls internal
    tls {
        on_demand
    }

    redir / /indi-allsky/

    handle /indi-allsky* {
        handle /images/* {
            root * %IMAGE_FOLDER%
            file_server
        }

        handle /static/* {
            root * %ALLSKY_DIRECTORY%/indi_allsky/flask/static
            file_server
        }

        handle {
            reverse_proxy %UPSTREAM_SERVER%
        }
    }
}
