---
services:
  mariadb.indi.allsky:
    image: mariadb:11
    container_name: mariadb.indi.allsky
    restart: unless-stopped
    env_file: .env
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-indi_allsky}
      MARIADB_USER: ${MARIADB_USER:-indi_allsky_own}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_RANDOM_ROOT_PASSWORD: ${MARIADB_RANDOM_ROOT_PASSWORD:-yes}
    volumes:
      - database_indi_allsky:/var/lib/mysql
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-u", "${MARIADB_USER:-indi_allsky_own}", "-p${MARIADB_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 45s

  indiserver.indi.allsky:
    image: ${INDIALLSKY_IMAGE:-indi-allsky:latest}
    container_name: indiserver.indi.allsky
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APT_CHANNEL: ${INDIALLSKY_APT_CHANNEL:-nightly}
    command: indiserver
    restart: unless-stopped
    env_file: .env
    privileged: true
    ports:
      - "17624:7624"
    volumes:
      - config_indi_allsky:/etc/indi-allsky:ro
      - /run/udev:/run/udev:ro
      #- /dev:/dev  # enable for dynamic USB camera hotplugging

  gunicorn.indi.allsky:
    image: ${INDIALLSKY_IMAGE:-indi-allsky:latest}
    container_name: gunicorn.indi.allsky
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APT_CHANNEL: ${INDIALLSKY_APT_CHANNEL:-nightly}
    command: gunicorn
    restart: unless-stopped
    env_file: .env
    depends_on:
      mariadb.indi.allsky:
        condition: service_healthy
    volumes:
      - config_indi_allsky:/etc/indi-allsky
      - images_indi_allsky:/var/www/html/allsky
      - migrations_indi_allsky:/var/lib/indi-allsky/migrations
      # Development: uncomment to live-mount local code into container
      #- ../indi_allsky:/usr/share/indi-allsky/indi_allsky
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/indi-allsky/')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  capture.indi.allsky:
    image: ${INDIALLSKY_IMAGE:-indi-allsky:latest}
    container_name: capture.indi.allsky
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        APT_CHANNEL: ${INDIALLSKY_APT_CHANNEL:-nightly}
    command: capture
    restart: unless-stopped
    env_file: .env
    depends_on:
      mariadb.indi.allsky:
        condition: service_healthy
      indiserver.indi.allsky:
        condition: service_started
      gunicorn.indi.allsky:
        condition: service_healthy
    # Uncomment for Raspberry Pi CSI/MIPI camera (libcamera / rpicam-still) support:
    # privileged: true
    volumes:
      - config_indi_allsky:/etc/indi-allsky
      - images_indi_allsky:/var/www/html/allsky
      #- /run/udev:/run/udev:ro  # enable for libcamera
      #- /dev:/dev              # enable for libcamera
      # Development: uncomment to live-mount local code into container
      #- ../indi_allsky:/usr/share/indi-allsky/indi_allsky
      #- ../allsky.py:/usr/share/indi-allsky/allsky.py
      #- ../darks.py:/usr/share/indi-allsky/darks.py

  webserver.indi.allsky:
    image: nginx:alpine
    container_name: webserver.indi.allsky
    restart: unless-stopped
    depends_on:
      gunicorn.indi.allsky:
        condition: service_healthy
    ports:
      - "8080:80"
      - "8443:443"
    command: >
      sh -c '
        while [ ! -f /etc/indi-allsky/nginx.conf ]; do
          echo "Waiting for /etc/indi-allsky/nginx.conf..."
          sleep 1
        done
        cp /etc/indi-allsky/nginx.conf /etc/nginx/conf.d/default.conf
        exec nginx -g "daemon off;"
      '
    volumes:
      - config_indi_allsky:/etc/indi-allsky:ro
      - images_indi_allsky:/var/www/html/allsky:ro

  # Optional: MQTT Broker (Mosquitto)
  # If you do not use MQTT or already have an external broker (e.g. Home Assistant),
  # you can comment out the mosquitto service below and the mosquitto_data_indi_allsky volume.
  mosquitto.indi.allsky:
    image: eclipse-mosquitto:2
    container_name: mosquitto.indi.allsky
    restart: unless-stopped
    env_file: .env
    depends_on:
      gunicorn.indi.allsky:
        condition: service_healthy
    ports:
      - "18883:8883"
      - "18081:8081"
    command: >
      sh -c '
        while [ ! -f /etc/indi-allsky/mosquitto.conf ]; do
          echo "Waiting for /etc/indi-allsky/mosquitto.conf..."
          sleep 1
        done
        if [ ! -f /mosquitto/data/passwd ] && [ -n "$${INDIALLSKY_MOSQUITTO_USER}" ]; then
          mosquitto_passwd -b -c /mosquitto/data/passwd "$${INDIALLSKY_MOSQUITTO_USER}" "$${INDIALLSKY_MOSQUITTO_PASS:-password}"
        fi
        if [ -f /mosquitto/data/passwd ]; then
          chown mosquitto:mosquitto /mosquitto/data/passwd 2>/dev/null || true
          chmod 0700 /mosquitto/data/passwd 2>/dev/null || true
        fi
        exec /usr/sbin/mosquitto -c /etc/indi-allsky/mosquitto.conf
      '
    volumes:
      - config_indi_allsky:/etc/indi-allsky:ro
      - mosquitto_data_indi_allsky:/mosquitto/data

volumes:
  database_indi_allsky:
  migrations_indi_allsky:
  images_indi_allsky:
  mosquitto_data_indi_allsky:  # Comment out if mosquitto service is disabled
  config_indi_allsky:
