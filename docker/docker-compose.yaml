---
services:
  mariadb.indi.allsky:
    image: mariadb.indi.allsky
    build:
      context: ..
      dockerfile: docker/Dockerfile.mariadb
    env_file: .env
    volumes:
      - database_indi_allsky:/var/lib/mysql
    ports:
      - "13306:3306"


  indiserver.indi.allsky:
    image: indiserver.indi.allsky
    build:
      context: ..
      dockerfile: docker/Dockerfile.indiserver
      args:
        - TZ=${TZ:-UTC}
    env_file: .env
    privileged: true
    ports:
      - "17624:7624"
    volumes:
      - /run/udev:/run/udev:ro


  app.base.indi.allsky:
    image: indi-allsky:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        - TZ=${TZ:-UTC}
    env_file: .env


  gunicorn.indi.allsky:
    image: indi-allsky:latest
    entrypoint: ["/usr/local/bin/start_gunicorn.sh"]
    env_file: .env
    depends_on:
      - app.base.indi.allsky
      - mariadb.indi.allsky
    volumes:
      - images_indi_allsky:/var/www/html/allsky
      - migrations_indi_allsky:/var/lib/indi-allsky


  capture.indi.allsky:
    image: indi-allsky:latest
    entrypoint: ["/usr/local/bin/start_indi_allsky.sh"]
    env_file: .env
    depends_on:
      - app.base.indi.allsky
      - mariadb.indi.allsky
      - indiserver.indi.allsky
    privileged: true
    volumes:
      - images_indi_allsky:/var/www/html/allsky
      - /run/udev:/run/udev:ro


  webserver.indi.allsky:
    image: webserver.indi.allsky
    build:
      context: ..
      dockerfile: docker/Dockerfile.webserver_apache
      #dockerfile: docker/Dockerfile.webserver_nginx
      args:
        - TZ=${TZ:-UTC}
        - INDIALLSKY_IMAGE_FOLDER=${INDIALLSKY_IMAGE_FOLDER:-/var/www/html/allsky/images}
    env_file: .env
    depends_on:
      - gunicorn.indi.allsky
    volumes:
      - images_indi_allsky:/var/www/html/allsky
    ports:
      - "8080:80"
      - "8443:443"


  mosquitto.indi.allsky:
    image: mosquitto.indi.allsky
    build:
      context: ..
      dockerfile: docker/Dockerfile.mosquitto
      args:
        - MOSQUITTO_USER=${INDIALLSKY_MOSQUITTO_USER:-admin}
        - MOSQUITTO_PASS=${INDIALLSKY_MOSQUITTO_PASS:-adminpassword}
    env_file: .env
    volumes:
      - mosquitto_data_indi_allsky:/mosquitto/data
    ports:
      - "18883:8883"
      - "18081:8081"


volumes:
  database_indi_allsky:
  migrations_indi_allsky:
  images_indi_allsky:
  mosquitto_data_indi_allsky:
