[pytest]
testpaths = tests
filterwarnings =
    # Ignore upstream third-party deprecations (Flask-Login datetime.utcnow and photutils column naming)
    ignore::DeprecationWarning:flask_login.*
    ignore::astropy.utils.exceptions.AstropyDeprecationWarning
    # Ignore NumPy array divide where uninitialized memory warning when deliberate
    ignore:'where' used without 'out', expect unitialized memory in output.*:UserWarning
